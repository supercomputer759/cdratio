<!DOCTYPE html>

<html lang="ko">
  <head>
    <meta charset="utf-8">
    <title>쿠키득용 비율 계산기!</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon-72.png">
  </head>

  <body>
    <div class="app">
      <h1>쿠키득 레시피 비율 계산기</h1>

      <div class="top">
        <button id="financierBtn" class="active">휘낭시에</button>
        <button id="sableBtn">사브레(플)</button>
        <button id="sableChocBtn">사브레(초)</button>
      </div>

      <div class="grid">
        <div class="left" id="inputs"></div>
        <pre id="result">값을 입력하면 자동 계산됨</pre>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
